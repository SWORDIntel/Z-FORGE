# Z-FORGE Enhanced Services Build Specification
# Includes: Netdata, Docker/Portainer, NetBird, Optional KDE Desktop
# Generated by Claude Agent Framework

metadata:
  name: "Z-FORGE Enhanced Services"
  version: "2.1.0"
  description: "Z-FORGE with comprehensive monitoring, containerization, secure networking, and optional desktop"
  author: "Z-FORGE Team via Claude Agents"
  created: "2025-08-25"
  target_success_rate: 90
  estimated_build_time_minutes: 45
  kernel_version: "6.14.8-1"

# Base system configuration
base_system:
  distribution: "debian"
  release: "trixie"
  architecture: "amd64"
  locale: "en_US.UTF-8"
  timezone: "UTC"
  
# Package management
repositories:
  - name: "main"
    url: "http://deb.debian.org/debian"
    components: ["main", "contrib", "non-free", "non-free-firmware"]
  - name: "security"
    url: "http://security.debian.org/debian-security"
    components: ["main", "contrib", "non-free", "non-free-firmware"]
  - name: "updates"
    url: "http://deb.debian.org/debian-updates"
    components: ["main", "contrib", "non-free", "non-free-firmware"]

# Build modules to execute
modules:
  # Core modules (existing)
  - workspace_setup
  - debootstrap
  - kernel_acquisition
  - dracut_config
  - zfs_build
  
  # New service modules
  - service_orchestrator    # Master service coordinator
  - netdata_integration     # Monitoring system
  - docker_stack           # Docker + Portainer
  - netbird_integration    # Secure networking
  - kde_optional           # Desktop environment (manual start)
  
  # Final modules
  - live_environment
  - iso_generation
  - validation

# Service configuration
services:
  # Service orchestration
  orchestrator:
    enable: true
    manage_dependencies: true
    health_checks: true
    
  # Netdata monitoring
  netdata:
    enable: true
    port: 19999
    memory_limit: "512M"
    enable_zfs_monitoring: true
    plugins:
      - zfs
      - docker
      - systemd
      - network
      - disks
    autostart: true
    
  # Docker containerization
  docker:
    enable: true
    storage_driver: "zfs"
    data_root: "/var/lib/docker"
    enable_portainer: true
    portainer_port: 9000
    compose_version: "v2.24.0"
    autostart: true
    zfs_dataset: "rpool/docker"
    
  # NetBird secure networking
  netbird:
    enable: true
    management_url: ""  # Leave empty for cloud, or specify self-hosted
    setup_key: ""       # Add setup key for auto-registration
    enable_ssh_access: true
    enable_routing: false
    interface_name: "wt0"
    autostart: true
    
  # KDE Plasma desktop
  kde:
    enable: false       # Set to true to install KDE
    variant: "minimal"  # Options: minimal, standard, full
    autostart: false    # MUST remain false for manual startup
    display_manager: false  # Disable display manager autostart

# Additional packages
packages:
  # System utilities
  system:
    - sudo
    - vim
    - nano
    - htop
    - tmux
    - git
    - curl
    - wget
    - net-tools
    - dnsutils
    - ncdu
    - tree
    - rsync
    - openssh-server
    - openssh-client
    
  # Development tools
  development:
    - build-essential
    - python3
    - python3-pip
    - python3-venv
    - gcc
    - make
    - cmake
    
  # Monitoring tools
  monitoring:
    - sysstat
    - iotop
    - iftop
    - nethogs
    - lm-sensors
    - smartmontools
    
  # Security tools
  security:
    - fail2ban
    - ufw
    - rkhunter
    - lynis
    - aide

# ZFS configuration
zfs:
  enable: true
  pool_name: "rpool"
  datasets:
    - name: "rpool/ROOT"
      mountpoint: "/"
      compression: "lz4"
      atime: "off"
    - name: "rpool/home"
      mountpoint: "/home"
      compression: "lz4"
      atime: "off"
    - name: "rpool/docker"
      mountpoint: "/var/lib/docker"
      compression: "lz4"
      atime: "off"
    - name: "rpool/data"
      mountpoint: "/data"
      compression: "lz4"
      atime: "off"

# Kernel configuration
kernel:
  version: "6.14.8-1"
  variant: "cloud"
  modules:
    - zfs
    - wireguard
    - vfio
    - vfio_pci
    - vfio_iommu_type1
  parameters:
    - "quiet"
    - "splash"
    - "zfs.zfs_arc_max=4294967296"  # 4GB ARC max

# Network configuration
network:
  hostname: "zforge-enhanced"
  domain: "local"
  primary_interface: "eth0"
  configuration: "dhcp"
  enable_ipv6: true
  firewall:
    enable: true
    default_policy: "deny"
    allowed_ports:
      - 22    # SSH
      - 19999 # Netdata
      - 9000  # Portainer
      - 51820 # WireGuard/NetBird

# Build optimizations
build_options:
  use_tmpfs: true
  tmpfs_size: "16G"
  parallel_jobs: 16
  enable_ccache: true
  cache_directory: "/var/cache/zforge"
  compression: "xz"
  compression_level: 6

# ISO configuration
iso:
  name: "zforge-enhanced-services"
  label: "Z-FORGE_ENHANCED"
  publisher: "Z-FORGE Project"
  application: "Z-FORGE Enhanced Services Linux"
  boot_loader: "grub"
  boot_modes:
    - "bios"
    - "uefi"
  include_installer: true
  installer: "calamares"

# Validation requirements
validation:
  required_services:
    - sshd
    - netdata
    - docker
    - containerd
  optional_services:
    - portainer
    - netbird
    - sddm
  required_ports:
    - 22
    - 19999
    - 9000
  required_commands:
    - docker
    - netdata
    - zfs
    - zpool
  minimum_disk_space_gb: 20
  minimum_memory_mb: 2048

# Post-installation scripts
post_install:
  - name: "configure_services"
    script: |
      #!/bin/bash
      # Enable essential services
      systemctl enable ssh
      systemctl enable netdata
      systemctl enable docker
      systemctl enable netbird
      
      # Disable GUI autostart
      systemctl disable sddm || true
      systemctl mask sddm || true
      systemctl set-default multi-user.target
      
      # Configure ZFS
      zpool set cachefile=/etc/zfs/zpool.cache rpool || true
      
  - name: "create_users"
    script: |
      #!/bin/bash
      # Create default admin user
      useradd -m -s /bin/bash -G sudo,docker,netdata admin || true
      echo "admin:zforge" | chpasswd
      
  - name: "system_optimization"
    script: |
      #!/bin/bash
      # System optimizations
      echo "vm.swappiness=10" >> /etc/sysctl.conf
      echo "net.ipv4.tcp_congestion_control=bbr" >> /etc/sysctl.conf
      sysctl -p

# Success criteria
success_criteria:
  build_completes: true
  iso_boots: true
  services_start: true
  network_accessible: true
  zfs_functional: true
  docker_operational: true
  minimum_success_rate: 85

# Notes
notes: |
  This enhanced build specification includes:
  - Netdata for comprehensive system monitoring
  - Docker with Portainer for container management
  - NetBird for secure zero-trust networking
  - Optional KDE Plasma desktop (manual start only)
  - ZFS storage with optimized datasets
  - Professional service orchestration
  
  The system boots to console by default.
  To start KDE: login and run 'start-kde' or 'startx'
  
  Access points after installation:
  - Netdata: http://[IP]:19999
  - Portainer: http://[IP]:9000
  - SSH: ssh admin@[IP]
  - NetBird: Automatic secure networking
  
  Default credentials:
  - Username: admin
  - Password: zforge (change immediately)