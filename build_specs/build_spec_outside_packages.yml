# Z-FORGE Build Specification - Maximum Outside Build
# Builds as many packages as possible outside chroot for speed and safety

name: Z-FORGE Outside Packages Build
version: 3.0

builder_config:
  debian_release: trixie
  kernel_version: 6.14.8-1
  output_iso_name: zforge-3.0-outside-build-amd64.iso
  enable_debug: false
  workspace_path: /home/john/zforge_workspace
  cache_packages: true
  auto_detect_hardware: true
  iso_version: '3.0-outside'
  # Environment vars to avoid /tmp
  environment:
    TMPDIR: ${HOME}/zforge_workspace/temp
    TEMP: ${HOME}/zforge_workspace/temp
    TMP: ${HOME}/zforge_workspace/temp

# All packages built outside chroot
prebuilt_packages:
  enabled: true
  source_dir: ${HOME}/github/Z-FORGE/prebuilt_packages
  categories:
    - zfs
    - kernel
    - bootloaders
    - system
    - utilities
    - calamares
  install_script: install_in_chroot.sh

proxmox_config:
  version: "9.0-beta"
  minimal_install: true
  build_from_source: false  # Use prebuilt
  install_method: prebuilt_packages
  package_dir: ${HOME}/github/Z-FORGE/prebuilt_packages/proxmox

zfs_config:
  version: 2.3.3
  build_from_source: false  # Use prebuilt from Proxmox source
  install_method: prebuilt_packages
  package_dir: ${HOME}/github/Z-FORGE/prebuilt_packages/zfs
  enable_encryption: true
  compression:
    default: lz4
    algorithm: auto
  features:
    - raid_z_expansion
    - block_cloning
    - improved_performance

bootloader_config:
  primary: grub
  enable_zfsbootmenu: true
  encryption_support: true
  install_method: prebuilt_packages
  package_dir: ${HOME}/github/Z-FORGE/prebuilt_packages/bootloaders

hardware_detection:
  enabled: true
  enforce_zfs_mode: true

calamares_config:
  enabled: true
  install_method: prebuilt_packages
  package_dir: ${HOME}/github/Z-FORGE/prebuilt_packages/calamares

modules:
- name: workspace_setup
  enabled: true
  config:
    temp_dir: ${HOME}/zforge_workspace/temp

- name: prebuilt_package_copy
  enabled: true
  config:
    source: ${HOME}/github/Z-FORGE/prebuilt_packages
    destination: /tmp/prebuilt_packages
    
- name: gpg_bypass
  enabled: true
  
- name: universal_hardware_detect
  enabled: true
  
- name: debootstrap
  enabled: true
  config:
    mirror: http://deb.debian.org/debian
    components: ["main", "contrib", "non-free-firmware"]
    cache_dir: ${HOME}/zforge_workspace/cache/debootstrap
    minimal_packages: true  # Install minimal set, rest from prebuilt
    
- name: kernel_acquisition
  enabled: true
  config:
    install_method: prebuilt_packages
    skip_download: true  # Use prebuilt kernel modules
    
- name: zfs_install_prebuilt
  enabled: true
  config:
    packages_dir: /tmp/prebuilt_packages/zfs
    install_script: /tmp/prebuilt_packages/install_in_chroot.sh
    
- name: proxmox_install_prebuilt
  enabled: true
  config:
    packages_dir: /tmp/prebuilt_packages/proxmox
    
- name: bootloader_install_prebuilt
  enabled: true
  config:
    packages_dir: /tmp/prebuilt_packages/bootloaders
    
- name: calamares_install_prebuilt
  enabled: true
  config:
    packages_dir: /tmp/prebuilt_packages/calamares
    
- name: live_environment
  enabled: true
  config:
    autologin: true
    user: zforge
    use_prebuilt_packages: true
    
- name: dracut_config
  enabled: true
  config:
    use_prebuilt: true
    
- name: security_hardening
  enabled: true
  
- name: zfs_encryption
  enabled: true
  
- name: cleanup_handler
  enabled: true
  
- name: iso_generation
  enabled: true
  config:
    compression: xz
    compression_level: 9