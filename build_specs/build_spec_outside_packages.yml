# Z-FORGE Build Specification - Maximum Outside Build
# Builds as many packages as possible outside chroot for speed and safety

name: Z-FORGE Outside Packages Build
version: 3.0

builder_config:
  debian_release: trixie
  kernel_version: 6.14.0-15-generic
  output_iso_name: zforge-3.0-outside-build-amd64.iso
  enable_debug: false
  workspace_path: "/dev/shm/zforge-workspace-outside"  # RAM build for 3-5x performance
  ram_build: true  # Enable full RAM builds
  cache_packages: true
  auto_detect_hardware: true
  iso_version: '3.0-outside'
  # Environment vars to avoid /tmp
  environment:
    TMPDIR: "/root/zforge_workspace/temp"
    TEMP: "/root/zforge_workspace/temp"
    TMP: "/root/zforge_workspace/temp"
    WORKSPACE_PATH: "/root/zforge_workspace"

# All packages built outside chroot
prebuilt_packages:
  enabled: true
  source_dir: "/home/ubuntu/Documents/Z-FORGE/prebuilt_packages"
  categories:
    - zfs
    - kernel
    - bootloaders
    - system
    - utilities
    - calamares
  install_script: install_in_chroot.sh

proxmox_config:
  version: "9.0"
  minimal_install: false
  build_from_source: true  # Enable source building
  native_compilation: true  # Compile with native CPU optimizations
  install_method: dkms_packages
  package_dir: "/home/ubuntu/Documents/Z-FORGE/prebuilt_packages/proxmox-9.0"
  source_dir: "/home/ubuntu/Documents/Z-FORGE/proxmox-sources"
  dkms_package: "zforge-zfs-proxmox-dkms"

zfs_config:
  version: 2.3.4
  build_from_source: false  # Use prebuilt from Proxmox source
  install_method: prebuilt_packages
  package_dir: "/home/ubuntu/Documents/Z-FORGE/prebuilt_packages/zfs"
  enable_encryption: true
  compression:
    default: lz4
    algorithm: auto
  features:
    - raid_z_expansion
    - block_cloning
    - improved_performance

bootloader_config:
  primary: grub
  enable_zfsbootmenu: true
  encryption_support: true
  install_method: prebuilt_packages
  package_dir: "/home/ubuntu/Documents/Z-FORGE/prebuilt_packages/bootloaders"

hardware_detection:
  enabled: true
  enforce_zfs_mode: true

calamares_config:
  enabled: true
  install_method: prebuilt_packages
  package_dir: "/home/ubuntu/Documents/Z-FORGE/prebuilt_packages/calamares"

modules:
- name: workspace_setup
  enabled: true
  config:
    temp_dir: "/root/zforge_workspace/temp"

- name: prebuilt_package_copy
  enabled: true
  config:
    source: "/home/ubuntu/Documents/Z-FORGE/prebuilt_packages"
    destination: "/root/zforge_workspace/prebuilt_packages"
    
- name: gpg_bypass
  enabled: true
  
- name: universal_hardware_detect
  enabled: true
  
- name: debootstrap
  enabled: true
  config:
    mirror: "http://deb.debian.org/debian"
    components: ["main", "contrib", "non-free-firmware"]
    cache_dir: "/root/zforge_workspace/cache/debootstrap"
    minimal_packages: true  # Install minimal set, rest from prebuilt
    
- name: kernel_acquisition
  enabled: true
  config:
    install_method: prebuilt_packages
    skip_download: true  # Use prebuilt kernel modules
    
- name: zfs_install_prebuilt
  enabled: true
  config:
    packages_dir: "/root/zforge_workspace/prebuilt_packages/zfs"
    install_script: "/root/zforge_workspace/prebuilt_packages/install_in_chroot.sh"
    
- name: proxmox_dkms_install
  enabled: true
  config:
    dkms_package: "zforge-zfs-proxmox-dkms"
    packages_dir: "/root/zforge_workspace/prebuilt_packages/zfs-proxmox-2.3.4-dkms"
    compile_at_install: true
    native_optimization: true
    
- name: bootloader_install_prebuilt
  enabled: true
  config:
    packages_dir: "/root/zforge_workspace/prebuilt_packages/bootloaders"
    
- name: calamares_install_prebuilt
  enabled: true
  config:
    packages_dir: "/root/zforge_workspace/prebuilt_packages/calamares"
    
- name: live_environment
  enabled: true
  config:
    autologin: true
    user: zforge
    use_prebuilt_packages: true
    
- name: dracut_config
  enabled: true
  config:
    use_prebuilt: true
    
- name: security_hardening
  enabled: true
  
- name: zfs_encryption
  enabled: true
  
- name: cleanup_handler
  enabled: true
  
- name: iso_generation
  enabled: true
  config:
    compression: xz
    compression_level: 9