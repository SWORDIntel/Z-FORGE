# Z-FORGE Build Specification - No /tmp Usage
# Corrected version with proper structure

builder_config:
  debian_release: trixie
  kernel_version: 6.14.0-15-generic
  output_iso_name: zforge-3.0-notmp-amd64.iso
  enable_debug: false
  # Use home directory workspace instead of /tmp
  workspace_path: /root/zforge_workspace
  # Alternative: use /var/lib for system-wide builds
  # workspace_path: /var/lib/zforge_workspace
  cache_packages: true
  auto_detect_hardware: true
  iso_version: '3.0'
  # Environment vars to avoid /tmp
  environment:
    TMPDIR: /root/zforge_workspace/temp
    TEMP: /root/zforge_workspace/temp
    TMP: /root/zforge_workspace/temp

proxmox_config:
  version: latest
  minimal_install: true
  build_from_source: false
  include_packages: []

zfs_config:
  version: 2.3.3
  build_from_source: false
  enable_encryption: true
  compression:
    default: lz4
    algorithm: auto
  features:
    - raid_z_expansion
    - block_cloning
    - improved_performance

bootloader_config:
  primary: grub
  enable_zfsbootmenu: true
  encryption_support: true

hardware_detection:
  enabled: true
  enforce_zfs_mode: true

calamares_config:
  enabled: true

modules:
- name: workspace_setup
  enabled: true
  config:
    # Avoid /tmp completely
    temp_dir: /root/zforge_workspace/temp
- name: gpg_bypass
  enabled: true
- name: universal_hardware_detect
  enabled: true
- name: debootstrap
  enabled: true
  config:
    mirror: http://deb.debian.org/debian
    components: ["main", "contrib", "non-free-firmware"]
    # Use our workspace cache
    cache_dir: /root/zforge_workspace/cache/debootstrap
- name: kernel_acquisition
  enabled: true
- name: zfs_build
  enabled: true
  config:
    install_method: prebuilt_packages
    package_dir: /home/ubuntu/Documents/Z-FORGE/prebuilt_packages
- name: proxmox_integration
  enabled: true
  config:
    install_method: prebuilt_packages
    package_dir: /home/ubuntu/Documents/Z-FORGE/prebuilt_packages
- name: live_environment
  enabled: true
  config:
    autologin: true
    user: zforge
- name: dracut_config
  enabled: true
- name: zfsbootmenu_install
  enabled: true
- name: bootloader_setup
  enabled: true
- name: security_hardening
  enabled: true
- name: zfs_encryption
  enabled: true
- name: calamares_integration
  enabled: true
- name: cleanup_handler
  enabled: true
- name: iso_generation
  enabled: true
  config:
    output_dir: /root/zforge_workspace/output
    compression: xz

name: Z-FORGE
version: '3.0'
codename: proxmox9-beta
architecture: amd64

# Security settings
security:
  enable_root: false
  password_hash: "$6$rounds=4096$defaultsalt$defaulthash"
  
# Hardware profiles
hardware_profiles:
  generic:
    cpu_governor: performance
    kernel_parameters: quiet splash