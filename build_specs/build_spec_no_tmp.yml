# Z-FORGE Build Specification - No /tmp Usage
# Corrected version with proper structure

builder_config:
  debian_release: trixie
  kernel_version: 6.14.0-15-generic
  output_iso_name: zforge-3.0-notmp-amd64.iso
  enable_debug: false
  # RAM workspace as per user instruction "all builds are to also use RAM"
  workspace_path: /dev/shm/zforge-workspace-notmp  # RAM build for 3-5x performance
  ram_build: true  # Enable RAM builds as requested
  cache_packages: true
  auto_detect_hardware: true
  iso_version: '3.0'
  # Environment vars for RAM builds
  environment:
    TMPDIR: /dev/shm/zforge-workspace-notmp/temp
    TEMP: /dev/shm/zforge-workspace-notmp/temp
    TMP: /dev/shm/zforge-workspace-notmp/temp

proxmox_config:
  version: latest
  minimal_install: false
  build_from_source: false
  include_packages: []

zfs_config:
  version: 2.3.4
  build_from_source: false
  enable_encryption: true
  compression:
    default: lz4
    algorithm: auto
  features:
    - raid_z_expansion
    - block_cloning
    - improved_performance

bootloader_config:
  primary: grub
  enable_zfsbootmenu: true
  encryption_support: true

hardware_detection:
  enabled: true
  enforce_zfs_mode: true

calamares_config:
  enabled: true

modules:
- name: workspace_setup
  enabled: true
  config:
    # Use RAM workspace
    temp_dir: /dev/shm/zforge-workspace-notmp/temp
- name: gpg_bypass
  enabled: true
- name: universal_hardware_detect
  enabled: true
- name: debootstrap
  enabled: true
  config:
    mirror: http://deb.debian.org/debian
    components: ["main", "contrib", "non-free-firmware"]
    # Use RAM workspace cache
    cache_dir: /dev/shm/zforge-workspace-notmp/cache/debootstrap
- name: kernel_acquisition
  enabled: true
- name: zfs_build
  enabled: true
  config:
    install_method: prebuilt_packages
    package_dir: "prebuilt_packages"
- name: proxmox_integration
  enabled: true
  config:
    install_method: prebuilt_packages
    package_dir: "prebuilt_packages"
- name: live_environment
  enabled: true
  config:
    autologin: true
    user: zforge
- name: dracut_config
  enabled: true
- name: zfsbootmenu_install
  enabled: true
- name: bootloader_setup
  enabled: true
- name: security_hardening
  enabled: true
- name: zfs_encryption
  enabled: true
- name: calamares_integration
  enabled: true
- name: cleanup_handler
  enabled: true
- name: iso_generation
  enabled: true
  config:
    output_dir: /dev/shm/zforge-workspace-notmp/output
    compression: xz

name: Z-FORGE
version: '3.0'
codename: proxmox9-beta
architecture: amd64

# Security settings
security:
  enable_root: false
  password_hash: "$6$rounds=4096$defaultsalt$defaulthash"
  
# Hardware profiles
hardware_profiles:
  generic:
    cpu_governor: performance
    kernel_parameters: quiet splash