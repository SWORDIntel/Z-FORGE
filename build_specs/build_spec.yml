builder_config:
  debian_release: trixie
  kernel_version: 6.14.0-15-generic
  output_iso_name: zforge-3.0-amd64.iso
  enable_debug: false
  workspace_path: /dev/shm/zforge-workspace-main  # RAM build for 3-5x performance
  ram_build: true  # Enable full RAM builds
  cache_packages: true
  auto_detect_hardware: true
  iso_version: '3.0'
  sysctl:
    net.ipv4.tcp_syncookies: 1
    net.ipv4.ip_forward: 0
    net.ipv4.conf.all.accept_source_route: 0
    net.ipv4.conf.all.accept_redirects: 0
    net.ipv4.conf.all.secure_redirects: 0
    net.ipv4.conf.all.log_martians: 1
    net.ipv6.conf.all.disable_ipv6: 1
    kernel.randomize_va_space: 2
    fs.suid_dumpable: 0
    vm.mmap_min_addr: 65536
    kernel.kptr_restrict: 2
    kernel.dmesg_restrict: 1
    kernel.unprivileged_bpf_disabled: 1
proxmox_config:
  version: latest
  minimal_install: false
  build_from_source: false
  include_packages: []
zfs_config:
  version: 2.3.4
  build_from_source: false
  enable_encryption: true
  compression:
    default: lz4
    algorithm: auto
bootloader_config:
  primary: grub
  enable_zfsbootmenu: true
  encryption_support: true
hardware_detection:
  enabled: true
  enforce_zfs_mode: true
calamares_config:
  enabled: true
modules:
- name: workspace_setup
  enabled: true
- name: gpg_bypass
  enabled: true
- name: universal_hardware_detect
  enabled: true
- name: debootstrap
  enabled: true
- name: kernel_acquisition
  enabled: true
- name: zfs_build
  enabled: true
- name: proxmox_integration
  enabled: true
- name: live_environment
  enabled: true
- name: dracut_config
  enabled: true
- name: zfsbootmenu_install
  enabled: true
- name: bootloader_setup
  enabled: true
- name: security_hardening
  enabled: true
- name: zfs_encryption
  enabled: true
- name: calamares_integration
  enabled: true
- name: cleanup_handler
  enabled: true
- name: iso_generation
  enabled: true
name: Z-FORGE
version: '3.0'
codename: proxmox9-beta
architecture: amd64
