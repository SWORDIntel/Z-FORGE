# Z-FORGE Build Specification - Minimal Proxmox VE 9
# Minimal Proxmox VE 9 build with ZFS on Debian Trixie

name: Z-FORGE Minimal Proxmox VE 9 Build
version: 3.0

builder_config:
  debian_release: trixie
  kernel_version: 6.14.0-15-generic
  output_iso_name: zforge-3.0-no-proxmox-amd64.iso
  enable_debug: false
  workspace_path: "/dev/shm/zforge-workspace-noprox"  # RAM build for 3-5x performance
  ram_build: true  # Enable full RAM builds
  cache_packages: true
  auto_detect_hardware: true
  iso_version: '3.0-no-proxmox'

zfs_config:
  version: 2.3.4
  build_from_source: false
  enable_encryption: true
  compression:
    default: lz4
    algorithm: auto

bootloader_config:
  primary: grub
  enable_zfsbootmenu: true
  encryption_support: true

hardware_detection:
  enabled: true
  enforce_zfs_mode: true

calamares_config:
  enabled: false  # Skip for simplicity

modules:
- name: workspace_setup
  enabled: true
  
- name: gpg_bypass
  enabled: true
  
- name: universal_hardware_detect
  enabled: true
  
- name: debootstrap
  enabled: true
  config:
    mirror: "http://deb.debian.org/debian"
    components: ["main", "contrib", "non-free-firmware"]
    
- name: kernel_acquisition
  enabled: true
  
- name: zfs_build
  enabled: true

- name: proxmox_integration
  enabled: true
  config:
    minimal_install: false

- name: proxmox_package_install
  enabled: true

- name: proxmox_repo_setup
  enabled: true
  
- name: live_environment
  enabled: true
  
- name: dracut_config
  enabled: true
  
- name: security_hardening
  enabled: true
  
- name: zfs_encryption
  enabled: true
  
- name: cleanup_handler
  enabled: true
  
- name: iso_generation
  enabled: true
  config:
    compression: xz
    compression_level: 6