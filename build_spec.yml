# Z-Forge Universal Build Configuration
# Automatically detects and optimizes for any hardware

builder_config:
  debian_release: trixie
  kernel_version: latest
  output_iso_name: zforge-universal-proxmox-v3.iso
  enable_debug: true
  workspace_path: /tmp/zforge_workspace
  cache_packages: true
  # Universal build will detect optimal settings
  auto_detect_hardware: true

# System Configuration
system:
  desktop_environment: minimal  # Minimal for maximum compatibility

proxmox_config:
  version: latest
  minimal_install: true
  build_from_source: false
  use_beta_iso: false
  include_packages:
    - proxmox-ve
    - pve-kernel-6.8
    - zfs-dkms
    - zfsutils-linux
    - pve-zsync
    # Universal hardware support packages
    - ipmitool
    - openipmi
    - lm-sensors
    - nvme-cli
    - smartmontools
    - ethtool
    - fio
    - mdadm
    - snmp
    # CPU microcode for both Intel and AMD
    - intel-microcode
    - amd64-microcode
    - thermald
    - powertop
    - i7z
    # Various RAID tools
    - megacli
    - megactl
    - megaraid-status
    - storcli
    - sas2ircu
    # Dell tools (installed conditionally)
    - srvadmin-all
    # HP tools (installed conditionally)
    - hponcfg
    - hp-health
    # Various vendor tools
    - iucode-tool
    - cpufrequtils

zfs_config:
  version: "2.3.3"  # Explicitly use ZFS 2.3.3
  build_from_source: false  # Will try prebuilt, then chroot build with modules
  use_github_release: true  # Download from https://github.com/openzfs/zfs/releases/tag/zfs-2.3.3
  enable_encryption: true
  default_compression: lz4
  # Arc size will be auto-detected based on RAM
  arc_auto_size: true
  # ZFS 2.3.x features
  enable_block_cloning: true
  enable_vdev_properties: true
  # Fallback repositories for ZFS packages
  fallback_repositories:
    - "deb http://deb.debian.org/debian bookworm main contrib non-free-firmware"
    - "deb http://deb.debian.org/debian bookworm-backports main contrib non-free-firmware"

bootloader_config:
  primary: zfsbootmenu
  # Support both UEFI and BIOS
  enable_opencore: true
  enable_two_stage: true
  opencore_drivers:
    - NvmExpressDxe.efi
    - OpenRuntime.efi
    - XhciDxe.efi
    - OpenHfsPlus.efi
    - OpenPartitionDxe.efi
    - OpenUsbKbDxe.efi
  # Auto-detect UEFI/BIOS mode
  uefi_mode: auto

dracut_config:
  modules:
    - zfs
    - systemd
    - network
    - mdraid
    - lvm
    - multipath
    - iscsi
    - nfs
    - cifs
  compress: zstd
  hostonly: false  # Build universal initramfs
  # Universal kernel command line
  kernel_cmdline: "root=zfs:AUTO console=tty0 console=ttyS0,115200n8"
  # Include all possible drivers
  include_all_drivers: true

# Universal hardware detection
universal_config:
  detect_at_build: true
  detect_at_boot: true
  apply_optimal_settings: true
  # Hardware database integration
  use_hardware_db: true
  # Support for various vendors
  supported_vendors:
    - Dell
    - HP/HPE
    - Lenovo
    - IBM
    - Supermicro
    - Intel
    - AMD
    - ASUS
    - Gigabyte
    - MSI
    - ASRock
  # Fallback for unknown hardware
  unknown_hardware_mode: "safe"

# Post-install scripts will be selected based on detected hardware
post_install_scripts: []

modules:
  # Phase 0: Detection and Setup
  - name: WorkspaceSetup
    enabled: true
  - name: WorkspaceSafety  # CRITICAL: Must be early to track all mounts
    enabled: true
  - name: GPGBypass
    enabled: true
  - name: UniversalHardwareDetect
    enabled: true
    
  # Phase 1: Core Setup
  - name: Debootstrap
    enabled: true
  
  # Phase 2: Core System
  - name: KernelAcquisition
    enabled: true
  - name: ZFSBuild
    enabled: true
  - name: LiveEnvironment
    enabled: true
  
  # Phase 3: Boot Infrastructure
  - name: DracutConfig
    enabled: true
  - name: ZFSBootMenuInstall
    enabled: true
  - name: BootloaderSetup
    enabled: true
  
  # Phase 4: System Integration
  - name: ProxmoxIntegration
    enabled: true
  - name: SecurityHardening
    enabled: true
  - name: ZFSEncryption
    enabled: true
  - name: OpenCoreNVME
    enabled: true
  
  # Phase 5: User Interface
  - name: CalamaresIntegration
    enabled: true
  
  # Phase 6: Hardware Detection & Profiling
  - name: HardwareProfilerIntegration
    enabled: true
  
  # Phase 7: Optimization
  - name: AutoOptimizer
    enabled: true
  - name: ZFSCompressionOptimizer
    enabled: true
  
  # Phase 8: Finalization
  - name: CleanupHandler
    enabled: true
  - name: ISOGeneration
    enabled: true