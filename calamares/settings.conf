---
# Z-FORGE Calamares Configuration
# Enhanced with complete module integration

modules-search: [ local ]

# Module instances for specialized configurations
instances:
- id:       zfs_root
  module:   zfsrootselect
  config:   zfsrootselect.conf
  
- id:       zfs_enhanced
  module:   zfsenhancedconfig
  config:   zfsenhancedconfig.conf

- id:       storage_layout
  module:   storagelayout
  config:   storagelayout.conf

# Installation sequence
sequence:
# Phase 1: User Interface (show modules)
- show:
  - welcome
  - locale
  - keyboard
  - users
  - hardwarehealth
  - networkconfig
  - storagelayout
  - zfsrootselect
  - zfsenhancedconfig
  - securityhardening
  - proxmoxconfig
  - gpupassthrough
  - telemetryconsent
  - summary

# Phase 2: Installation (exec modules)
- exec:
  - partition
  - zfspooldetect
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - zfsbootloader
  - postinstall
  - telemetryjob
  - zforgefinalize
  - umount

# Phase 3: Finish
- show:
  - finished

# Branding
branding: zforge

# Installation settings
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false