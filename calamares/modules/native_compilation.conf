---
# Native Compilation Module for Calamares
# Compiles ZFS and Proxmox with CPU-specific optimizations during installation

type: "job"
name: "native_compilation"
interface: "process"

# This is a heavy operation that requires time and resources
weight: 200

# Requirements
requirements:
    ram: 4096      # Minimum 4GB RAM for compilation
    storage: 3072  # 3GB free space for source and build
    internet: false # Can work offline with included sources

# Command to run
command: "/usr/lib/calamares/modules/native_compilation/compile_native.sh"
timeout: 2400  # 40 minutes maximum

# Progress tracking
progress:
    enabled: true
    stages:
        - name: "detect_hardware"
          weight: 5
          description: "Detecting hardware capabilities..."
        - name: "prepare_environment" 
          weight: 10
          description: "Preparing build environment..."
        - name: "compile_zfs"
          weight: 40
          description: "Compiling ZFS with native optimizations..."
        - name: "compile_proxmox"
          weight: 35
          description: "Compiling Proxmox components..."
        - name: "install_modules"
          weight: 10
          description: "Installing optimized modules..."

# Configuration
configuration:
    zfs_version: "2.3.4"
    proxmox_version: "9.0"
    optimization_level: "native"  # native, aggressive, conservative
    parallel_jobs: 0  # 0 = auto-detect CPU cores
    enable_debug: false
    
# Only run if DKMS package is available
dontChroot: false
onlyIf:
    - condition: "fileExists"
      path: "/cdrom/pool/main/z/zforge/zforge-zfs-proxmox-dkms_*_all.deb"

# Emergency fallback if compilation fails
fallback:
    enabled: true
    command: "/usr/lib/calamares/modules/native_compilation/install_prebuilt.sh"
    timeout: 300
    description: "Installing prebuilt packages as fallback..."